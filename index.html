<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="css/style.css" />
    <title>Calculadora de Tina</title>
  </head>

  <body>
    <!-- Titulo-->
    <div class="calculadora">
      <div>
        <h1>Calculadora de Tina</h1>
      </div>

      <!-- Primer numero-->
      <div>
        Primer número:
        <br />
        <input type="number" id="numero1" />
      </div>

      <!-- Segundo numero-->
      <div>
        Segundo número:
        <br />
        <input type="number" id="numero2" />
      </div>

      <!-- Espaciado-->
      <br />

      <!-- Botón sumar-->
      <button onclick="sumar()">Sumar</button>

      <!-- Resultado impreso-->
      <h2>
        Resultado:
        <div id="resultado">0</div>
      </h2>
    </div>
  </body>
</html>
